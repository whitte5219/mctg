<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTG - Minecraft Tools & Guides</title>
    <style>
        :root {
            --bg: #000000;
            --bg-nav: #050505;
            --bg-card: #0a0a0a;
            --bg-input: #0d0d0d;
            --bg-modal: #0f0f0f;
            --border: #1a1a1a;
            --border-light: #252525;
            --border-hover: #353535;
            --text: #e0e0e0;
            --text-mid: #aaaaaa;
            --text-dim: #666666;
            --text-bright: #ffffff;
            --discord: #5865F2;
            --danger: #c0392b;
            --moderator: #c0392b;
            --add-green: #27ae60;
            --star: #888;
            --star-active: #fff;
            --radius: 6px;
            --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            height: 100%;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #1a1a1a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2a2a2a;
        }

        /* TOP NAV */
        .top-nav {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 52px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            user-select: none;
        }
        .nav-brand {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-bright);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .nav-brand span {
            color: var(--text-dim);
            font-weight: 400;
        }
        .nav-tabs {
            display: flex;
            gap: 4px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-tab {
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-dim);
            background: transparent;
            border: none;
            font-family: var(--font);
            white-space: nowrap;
            transition: 0.2s;
        }
        .nav-tab:hover {
            color: var(--text-mid);
            background: rgba(255, 255, 255, 0.03);
        }
        .nav-tab.active {
            color: var(--text-bright);
            background: rgba(255, 255, 255, 0.07);
            font-weight: 600;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 101;
        }
        .moderator-badge {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--moderator);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #8b0000;
        }
        .add-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--add-green);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            border: 2px solid #1e7a3a;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-btn:hover {
            background: #2ecc71;
            transform: scale(1.08);
        }
        .login-btn {
            background: transparent;
            border: 1px solid var(--discord);
            color: #aeb9ff;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.76rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .login-btn:hover {
            background: rgba(88, 101, 242, 0.1);
            border-color: #7680f0;
            color: #c9cdff;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.76rem;
            color: var(--text-mid);
        }
        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-dim);
            padding: 5px 10px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .logout-btn:hover {
            border-color: #444;
            color: var(--text-mid);
            background: rgba(255, 255, 255, 0.03);
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .page-section {
            display: none;
            flex: 1;
            animation: fadeIn 0.35s;
        }
        .page-section.active {
            display: flex;
            flex-direction: column;
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        /* HOME */
        #home-section {
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 52px);
            padding: 40px 20px;
            text-align: center;
            gap: 20px;
        }
        .home-big-text {
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 800;
            letter-spacing: -2px;
            color: var(--text-bright);
            line-height: 1;
            transition: opacity 0.7s;
        }
        .home-big-text.flicker {
            animation: flicker 0.2s 3;
        }
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .home-subtitle {
            font-size: 1rem;
            color: var(--text-dim);
            max-width: 600px;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.7s 0.15s, transform 0.7s 0.15s;
            margin: 0 auto;
        }
        .home-subtitle.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .home-stats-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.7s 0.3s, transform 0.7s 0.3s;
        }
        .home-stats-row.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 28px;
            min-width: 150px;
            text-align: center;
            transition: 0.2s;
        }
        .stat-card:hover {
            border-color: var(--border-hover);
            background: #0d0d0d;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        .stat-number {
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--text-bright);
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 6px;
            font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        /* TOOLS / GUIDES */
        #tools-section,
        #guides-section {
            padding: 24px 24px 40px;
            min-height: calc(100vh - 52px);
        }
        .sub-tabs-row {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }
        .sub-tab {
            padding: 7px 14px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.76rem;
            font-weight: 500;
            color: var(--text-dim);
            background: transparent;
            border: none;
            transition: 0.2s;
        }
        .sub-tab:hover {
            color: var(--text-mid);
            background: rgba(255,255,255,0.025);
        }
        .sub-tab.active {
            color: var(--text-bright);
            background: rgba(255,255,255,0.07);
            font-weight: 600;
        }
        .sub-description {
            font-size: 0.82rem;
            color: var(--text-dim);
            margin-bottom: 16px;
            font-style: italic;
        }
        .search-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 18px;
        }
        .search-input {
            flex: 1;
            min-width: 180px;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--border-hover);
        }
        .search-mode-toggle {
            display: flex;
            gap: 4px;
            background: #0a0a0a;
            border-radius: 20px;
            padding: 3px;
        }
        .mode-btn {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-dim);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn.active {
            background: #1a1a1a;
            color: #fff;
        }
        .search-btn {
            padding: 10px 18px;
            background: #111;
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            color: var(--text-mid);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            transition: 0.2s;
            white-space: nowrap;
        }
        .search-btn:hover {
            background: #181818;
            border-color: var(--border-hover);
            color: var(--text-bright);
        }
        .filter-select {
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 0.82rem;
            cursor: pointer;
            outline: none;
        }
        .results-area {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }
        .login-prompt {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        .item-banner {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px 20px;
            display: flex;
            gap: 14px;
            transition: 0.2s;
            cursor: pointer;
            align-items: flex-start;
            width: 100%;
        }
        .item-banner:hover {
            border-color: var(--border-hover);
            background: #0d0d0d;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.5);
        }
        .banner-image {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            background: #111;
            border: 1px solid #222;
            flex-shrink: 0;
        }
        .banner-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .banner-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-bright);
        }
        .banner-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .banner-tag {
            font-size: 0.68rem;
            color: #777;
            background: #0f0f0f;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid #1a1a1a;
        }
        .banner-preview {
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.5;
        }
        .banner-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }
        .item-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            color: #ddd;
        }
        .view-btn {
            padding: 6px 16px;
            background: #111;
            border: 1px solid var(--border-light);
            border-radius: 16px;
            color: var(--text-mid);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: 0.2s;
        }
        .view-btn:hover {
            background: #1a1a1a;
            border-color: #444;
            color: #fff;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--bg-modal);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 24px;
            width: 100%;
            max-width: 620px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            animation: modalIn 0.25s;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
        }
        .modal .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: #666;
            font-size: 1.4rem;
            cursor: pointer;
        }
        .modal label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .modal input,
        .modal textarea,
        .modal select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            margin-bottom: 12px;
        }
        .modal textarea {
            resize: vertical;
            min-height: 70px;
        }
        .modal .btn-primary {
            padding: 10px 22px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
        }
        .modal .btn-secondary {
            padding: 10px 22px;
            background: transparent;
            color: #aaa;
            border: 1px solid #333;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
        }
        .char-counter {
            font-size: 0.68rem;
            color: #666;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 8px;
        }

        /* STAR RATING */
        .star-rating-interactive .star {
            font-size: 2rem;
            color: #333;
            cursor: pointer;
        }
        .star-rating-interactive .star.hover,
        .star-rating-interactive .star.selected {
            color: #fff;
        }

        @media (max-width: 768px) {
            .nav-tabs {
                position: static;
                transform: none;
            }
            .banner-image {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- TOP NAV -->
    <nav class="top-nav">
        <div class="nav-brand">MCTG <span>— Minecraft tools & guides</span></div>
        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="home">Home</button>
            <button class="nav-tab" data-tab="tools">Tools</button>
            <button class="nav-tab" data-tab="guides">Guides</button>
        </div>
        <div class="nav-right" id="navRight">
            <button class="login-btn" onclick="openAuthModal()">🔑 Login / Register</button>
        </div>
    </nav>

    <!-- MAIN -->
    <div class="main-content">
        <section class="page-section active" id="home-section">
            <h1 class="home-big-text" id="homeBigText">MCTG</h1>
            <p class="home-subtitle" id="homeSubtitle">This is the homepage of MCTG, a place where you can find any tool for any purpose, or any guide for anything for Minecraft, welcome.</p>
            <div class="home-stats-row" id="homeStatsRow">
                <div class="stat-card"><div class="stat-number" id="statTools">0</div><div class="stat-label">Total Tools</div></div>
                <div class="stat-card"><div class="stat-number" id="statGuides">0</div><div class="stat-label">Total Guides</div></div>
                <div class="stat-card"><div class="stat-number" id="statUsers">0</div><div class="stat-label">Daily Active</div></div>
            </div>
        </section>

        <section class="page-section" id="tools-section">
            <div class="sub-tabs-row" id="toolsSubTabs"></div>
            <p class="sub-description" id="toolsSubDesc"></p>
            <div class="search-row">
                <div class="search-mode-toggle" id="toolsSearchMode">
                    <button class="mode-btn active" data-mode="name">Name</button>
                    <button class="mode-btn" data-mode="tags">Tags</button>
                </div>
                <input class="search-input" id="toolsSearchInput" placeholder="Search...">
                <select class="filter-select" id="toolsPaidFilter"><option value="all">All</option><option value="yes">Paid</option><option value="no">Free</option></select>
                <button class="search-btn" id="toolsSearchBtn">Search</button>
            </div>
            <div class="results-area" id="toolsResults"></div>
        </section>

        <section class="page-section" id="guides-section">
            <div class="sub-tabs-row" id="guidesSubTabs"></div>
            <p class="sub-description" id="guidesSubDesc"></p>
            <div class="search-row">
                <div class="search-mode-toggle" id="guidesSearchMode">
                    <button class="mode-btn active" data-mode="name">Name</button>
                    <button class="mode-btn" data-mode="tags">Tags</button>
                </div>
                <input class="search-input" id="guidesSearchInput" placeholder="Search...">
                <button class="search-btn" id="guidesSearchBtn">Search</button>
            </div>
            <div class="results-area" id="guidesResults"></div>
        </section>
    </div>

    <!-- AUTH MODAL -->
    <div class="modal-overlay" id="authModalOverlay">
        <div class="modal">
            <button class="close-btn" onclick="closeAuthModal()">&times;</button>
            <h3 id="authModalTitle">🔑 Login</h3>
            <div id="authError" style="color:#e74c3c;font-size:0.8rem;margin-bottom:10px;display:none;"></div>
            <form id="authForm" autocomplete="off">
                <div id="usernameField" style="display:none;"><label>👤 Username</label><input type="text" id="authUsername" placeholder="How you want to be called..." minlength="2" maxlength="24"></div>
                <label>📧 Email</label><input type="email" id="authEmail" required>
                <label>🔒 Password</label><input type="password" id="authPassword" minlength="6" required>
                <button type="submit" class="btn-primary" style="width:100%;margin-top:8px;" id="authSubmitBtn">⚡ Login</button>
            </form>
            <p style="text-align:center;margin-top:12px;font-size:0.78rem;color:#aaa;">
                <span id="authToggleText">Don't have an account?</span> <a style="color:#aeb9ff;cursor:pointer;font-weight:600;" id="authToggleLink" onclick="toggleAuthMode()">Register here</a>
            </p>
        </div>
    </div>

    <!-- ADD/EDIT MODAL -->
    <div class="modal-overlay" id="addModalOverlay">
        <div class="modal">
            <button class="close-btn" onclick="closeAddModal()">&times;</button>
            <h3>➕ Add New Entry</h3>
            <form id="addForm" autocomplete="off">
                <label>Category</label><select id="addCategory" required><option value="tools">Tools</option><option value="guides">Guides</option></select>
                <label>Subcategory</label><select id="addSubcategory" required></select>
                <label>Name</label><input type="text" id="addName" maxlength="100" required>
                <label>Tags (comma separated, max 10)</label>
                <div style="display:flex;gap:6px;margin-bottom:8px;">
                    <input type="text" id="tagInput" placeholder="Type tag and press Enter" style="flex:1;">
                </div>
                <div id="tagsDisplay" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;"></div>
                <label>Preview Description (max 500)</label><textarea id="addPreviewDesc" maxlength="500" rows="2"></textarea>
                <div class="char-counter" id="previewCharCount">0 / 500</div>
                <label>Full Description (max 4000)</label><textarea id="addFullDesc" maxlength="4000" rows="4"></textarea>
                <div class="char-counter" id="fullCharCount">0 / 4000</div>
                <label>Image URL</label><input type="url" id="addImageUrl" placeholder="https://i.imgur.com/...">
                <label>Links (name & url)</label><div id="linksContainer"></div>
                <button type="button" class="btn-secondary" style="width:100%;margin-bottom:8px;" id="addLinkBtn">+ Add Link</button>
                <div style="display:flex;align-items:center;gap:8px;margin:8px 0;">
                    <input type="checkbox" id="addPaid"><label for="addPaid" style="margin:0;">Paid</label>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">✅ Submit</button>
            </form>
        </div>
    </div>

    <!-- VIEW MODAL -->
    <div class="modal-overlay" id="viewModalOverlay">
        <div class="modal" id="viewModal">
            <button class="close-btn" onclick="closeViewModal()">&times;</button>
            <div id="viewModalContent"></div>
        </div>
    </div>

    <div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid #333;color:#fff;padding:12px 24px;border-radius:24px;font-size:0.82rem;z-index:999;display:none;"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getDatabase, ref, set, get, push, onValue, serverTimestamp, remove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAEFAooiWJy3fPdQXV3RPVLMNppKyo4S94",
            authDomain: "robstein-b71f5.firebaseapp.com",
            databaseURL: "https://robstein-b71f5-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "robstein-b71f5",
            storageBucket: "robstein-b71f5.firebasestorage.app",
            messagingSenderId: "378067322754",
            appId: "1:378067322754:web:7ab17b18893766189a719b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // STATE
        let currentUser = null, isModerator = false, activeMainTab = 'home';
        let activeToolsSub = 'all', activeGuidesSub = 'all';
        let allToolsCache = [], allGuidesCache = [];
        let isRegisterMode = false, pendingTags = [], pendingLinks = [];
        let toolsSearchMode = 'name', guidesSearchMode = 'name';

        // DOM
        const $ = id => document.getElementById(id);
        const toolsSubTabs = $('toolsSubTabs'), guidesSubTabs = $('guidesSubTabs');
        const toolsSubDesc = $('toolsSubDesc'), guidesSubDesc = $('guidesSubDesc');
        const toolsResults = $('toolsResults'), guidesResults = $('guidesResults');
        const navRight = $('navRight');

        const subDescsTools = {
            all: 'All tools across every category.',
            pve: 'Tools for PvE, farming mobs, looting structures, or just normal survival.',
            pvp: 'Tools for PvPing, fighting other players, or fighting on normal/HVH servers.',
            building: 'Tools for advanced and better building, or structuring.',
            multifunctional: 'Tools with combined capabilities, that can do PvE, PvP and building.'
        };
        const subDescsGuides = {
            all: 'All guides across every category.',
            buildings: 'Guides for constructing impressive buildings and structures.',
            farms: 'Guides for building efficient farms — crop, mob, or XP.',
            glitches: 'Guides covering game-breaking exploits, duplication glitches, and advanced mechanics.',
            survival: 'Guides for thriving in survival mode — from day one to the endgame.',
            other: 'Miscellaneous guides that don\'t fit the other categories.'
        };

        // Toast
        function toast(msg, d=2500){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>{t.style.display='none';},d); }

        // Auth
        function openAuthModal(){ $('authModalOverlay').classList.add('open'); }
        function closeAuthModal(){ $('authModalOverlay').classList.remove('open'); }
        window.openAuthModal=openAuthModal; window.closeAuthModal=closeAuthModal;

        function toggleAuthMode(){ isRegisterMode=!isRegisterMode; updateAuthUI(); }
        window.toggleAuthMode=toggleAuthMode;
        function updateAuthUI(){
            $('authModalTitle').textContent=isRegisterMode?'📝 Register':'🔑 Login';
            $('authSubmitBtn').textContent=isRegisterMode?'✨ Create Account':'⚡ Login';
            $('authToggleText').textContent=isRegisterMode?'Already have an account?':'Don\'t have an account?';
            $('authToggleLink').textContent=isRegisterMode?'Login here':'Register here';
            $('usernameField').style.display=isRegisterMode?'block':'none';
            $('authUsername').required=isRegisterMode;
        }
        $('authForm').addEventListener('submit', async (e)=>{
            e.preventDefault();
            const email=$('authEmail').value.trim(), password=$('authPassword').value;
            try{
                if(isRegisterMode){
                    const uname=$('authUsername').value.trim();
                    if(!uname||uname.length<2||uname.length>24) return toast('Username 2-24 chars.');
                    const cred=await createUserWithEmailAndPassword(auth,email,password);
                    await set(ref(db,'users/'+cred.user.uid),{username:uname,email,createdAt:serverTimestamp()});
                    toast('✅ Account created!'); closeAuthModal();
                }else{
                    await signInWithEmailAndPassword(auth,email,password);
                    toast('👋 Welcome back!'); closeAuthModal();
                }
            }catch(err){ $('authError').textContent=err.message; $('authError').style.display='block'; }
        });

        // Auth state
        onAuthStateChanged(auth, async (user)=>{
            currentUser=user;
            if(user){
                try{
                    const sanitized=user.email.replace(/\./g,',');
                    const snap=await get(ref(db,'moderators/'+sanitized));
                    isModerator=snap.exists();
                }catch{isModerator=false;}
                try{
                    const today=new Date().toISOString().split('T')[0];
                    await set(ref(db,'activeUsers/'+user.uid),{date:today,email:user.email,lastSeen:serverTimestamp()});
                }catch{}
                const snap=await get(ref(db,'users/'+user.uid));
                const data=snap.val()||{};
                renderNavRight(data.username||user.email.split('@')[0]);
            }else{
                currentUser=null; isModerator=false; renderNavRight(null);
            }
            refreshView();
        });

        function renderNavRight(name){
            if(currentUser && name){
                let h='<div class="user-info">';
                if(isModerator) h+='<span class="moderator-badge">M</span><button class="add-btn" onclick="openAddModal()">+</button>';
                h+=`<span>👤 ${escapeHTML(name)}</span><button class="logout-btn" onclick="doLogout()">Logout</button></div>`;
                navRight.innerHTML=h;
            }else navRight.innerHTML='<button class="login-btn" onclick="openAuthModal()">🔑 Login / Register</button>';
        }
        async function doLogout(){ await signOut(auth); toast('👋 Logged out.'); }
        window.doLogout=doLogout;

        function escapeHTML(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

        // Data listeners
        function setupListeners(){
            onValue(ref(db,'tools'), snap=>{
                const d=snap.val()||{}; allToolsCache=Object.entries(d).map(([id,v])=>({id,...v}));
                if(activeMainTab==='tools') renderTools();
            });
            onValue(ref(db,'guides'), snap=>{
                const d=snap.val()||{}; allGuidesCache=Object.entries(d).map(([id,v])=>({id,...v}));
                if(activeMainTab==='guides') renderGuides();
            });
        }

        // Tab switching
        window.switchTab=function(tab){
            if(activeMainTab===tab) return;
            activeMainTab=tab;
            document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
            document.querySelector(`.nav-tab[data-tab="${tab}"]`).classList.add('active');
            document.querySelectorAll('.page-section').forEach(s=>s.classList.remove('active'));
            if(tab==='home'){
                $('home-section').classList.add('active');
                animateHome();
            }else if(tab==='tools'){
                $('tools-section').classList.add('active');
                renderTools();
            }else{
                $('guides-section').classList.add('active');
                renderGuides();
            }
        };

        function refreshView(){
            if(activeMainTab==='tools') renderTools();
            else if(activeMainTab==='guides') renderGuides();
            else animateHome();
        }

        // Sub tabs rendering
        function buildSubTabs(container, categories, current){
            container.innerHTML = categories.map(cat=>{
                const label = cat==='all'?'All':cat.charAt(0).toUpperCase()+cat.slice(1);
                return `<button class="sub-tab${cat===current?' active':''}" data-sub="${cat}">${label}</button>`;
            }).join('');
        }

        // Tools sub handlers
        const toolSubs = ['all','pve','pvp','building','multifunctional'];
        function switchToolsSub(sub){
            activeToolsSub=sub;
            buildSubTabs(toolsSubTabs, toolSubs, sub);
            toolsSubDesc.textContent=subDescsTools[sub];
            renderTools();
        }
        window.switchToolsSub=switchToolsSub;

        // Guides sub handlers
        const guideSubs = ['all','buildings','farms','glitches','survival','other'];
        function switchGuidesSub(sub){
            activeGuidesSub=sub;
            buildSubTabs(guidesSubTabs, guideSubs, sub);
            guidesSubDesc.textContent=subDescsGuides[sub];
            renderGuides();
        }
        window.switchGuidesSub=switchGuidesSub;

        // Build initial tabs
        buildSubTabs(toolsSubTabs, toolSubs, 'all');
        buildSubTabs(guidesSubTabs, guideSubs, 'all');
        toolsSubDesc.textContent=subDescsTools.all;
        guidesSubDesc.textContent=subDescsGuides.all;

        // Click delegation for sub tabs
        toolsSubTabs.addEventListener('click', e=>{ if(e.target.classList.contains('sub-tab')) switchToolsSub(e.target.dataset.sub); });
        guidesSubTabs.addEventListener('click', e=>{ if(e.target.classList.contains('sub-tab')) switchGuidesSub(e.target.dataset.sub); });

        // Search mode toggles
        $('toolsSearchMode').addEventListener('click', e=>{
            if(e.target.classList.contains('mode-btn')){
                toolsSearchMode=e.target.dataset.mode;
                $('toolsSearchMode').querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
                e.target.classList.add('active');
                renderTools();
            }
        });
        $('guidesSearchMode').addEventListener('click', e=>{
            if(e.target.classList.contains('mode-btn')){
                guidesSearchMode=e.target.dataset.mode;
                $('guidesSearchMode').querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
                e.target.classList.add('active');
                renderGuides();
            }
        });

        // Render functions
        function renderTools(){
            if(!currentUser){ toolsResults.innerHTML='<div class="login-prompt">🔒 Login to view — top right button</div>'; return; }
            const query=$('toolsSearchInput').value.trim().toLowerCase();
            const paid=$('toolsPaidFilter').value;
            let items=allToolsCache;
            if(activeToolsSub!=='all') items=items.filter(i=>i.subcategory===activeToolsSub);
            if(query){
                if(toolsSearchMode==='name') items=items.filter(i=>(i.name||'').toLowerCase().includes(query)||(i.previewDesc||'').toLowerCase().includes(query));
                else items=items.filter(i=>(i.tags||[]).some(t=>t.toLowerCase().includes(query)));
            }
            if(paid==='yes') items=items.filter(i=>i.paid===true);
            if(paid==='no') items=items.filter(i=>i.paid!==true);
            renderBanners(items, toolsResults, 'tools');
        }

        function renderGuides(){
            if(!currentUser){ guidesResults.innerHTML='<div class="login-prompt">🔒 Login to view — top right button</div>'; return; }
            const query=$('guidesSearchInput').value.trim().toLowerCase();
            let items=allGuidesCache;
            if(activeGuidesSub!=='all') items=items.filter(i=>i.subcategory===activeGuidesSub);
            if(query){
                if(guidesSearchMode==='name') items=items.filter(i=>(i.name||'').toLowerCase().includes(query)||(i.previewDesc||'').toLowerCase().includes(query));
                else items=items.filter(i=>(i.tags||[]).some(t=>t.toLowerCase().includes(query)));
            }
            renderBanners(items, guidesResults, 'guides');
        }

        function renderBanners(items, container, type){
            if(!items.length){ container.innerHTML='<div style="color:#666;text-align:center;padding:40px;">📦 No entries found.</div>'; return; }
            container.innerHTML=items.map(item=>{
                const ratings=item.ratings||{};
                const vals=Object.values(ratings);
                const total=vals.length;
                const avg=total?vals.reduce((s,r)=>s+(r.stars||0),0)/total:0;
                const stars='★'.repeat(Math.round(avg))+'☆'.repeat(5-Math.round(avg));
                const tags=(item.tags||[]).slice(0,10);
                const preview=(item.previewDesc||'').substring(0,500);
                return `
                <div class="item-banner" data-id="${item.id}" data-type="${type}">
                    ${item.imageUrl ? `<img class="banner-image" src="${escapeHTML(item.imageUrl)}" alt="img">` : ''}
                    <div class="banner-body">
                        <div class="banner-name">${escapeHTML(item.name||'Untitled')}</div>
                        <div class="banner-tags">${tags.map(t=>`<span class="banner-tag">#${escapeHTML(t)}</span>`).join('')}</div>
                        <div class="banner-preview">${escapeHTML(preview)}</div>
                        <div class="banner-footer">
                            <div class="item-rating"><span>${stars}</span> <span style="color:#888;">(${total})</span></div>
                            <button class="view-btn">View →</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            container.querySelectorAll('.item-banner').forEach(b=>b.addEventListener('click', function(e){
                if(e.target.classList.contains('view-btn')) return;
                const id=this.dataset.id, typ=this.dataset.type;
                const item=(typ==='tools'?allToolsCache:allGuidesCache).find(i=>i.id===id);
                if(item) openViewModal(item,typ);
            }));
            container.querySelectorAll('.view-btn').forEach(b=>b.addEventListener('click', function(e){
                e.stopPropagation();
                const banner=this.closest('.item-banner');
                const id=banner.dataset.id, typ=banner.dataset.type;
                const item=(typ==='tools'?allToolsCache:allGuidesCache).find(i=>i.id===id);
                if(item) openViewModal(item,typ);
            }));
        }

        // View modal
        function openViewModal(item, type){
            const ratings=item.ratings||{};
            const vals=Object.values(ratings);
            const total=vals.length;
            const avg=total?vals.reduce((s,r)=>s+(r.stars||0),0)/total:0;
            const stars='★'.repeat(Math.round(avg))+'☆'.repeat(5-Math.round(avg));
            const userRating=currentUser?ratings[currentUser.uid]:null;
            const tags=(item.tags||[]).slice(0,10);
            let html=`
                <h3 style="font-size:1.3rem;">${escapeHTML(item.name)}</h3>
                ${item.imageUrl?`<img src="${escapeHTML(item.imageUrl)}" style="max-width:100%;max-height:300px;border-radius:8px;margin:10px 0;">`:''}
                <div style="display:flex;gap:4px;margin-bottom:8px;">${tags.map(t=>`<span class="banner-tag">#${escapeHTML(t)}</span>`).join('')}</div>
                <div class="item-rating" style="margin-bottom:10px;">${stars} ${avg.toFixed(1)}/5 (${total})</div>
                <div style="background:#0a0a0a;padding:12px;border-radius:6px;margin:10px 0;white-space:pre-wrap;">${escapeHTML(item.fullDesc||item.previewDesc||'')}</div>
                ${item.links&&item.links.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;">${item.links.map(l=>`<a href="${escapeHTML(l.url)}" target="_blank" class="btn-secondary" style="text-decoration:none;">🔗 ${escapeHTML(l.name)}</a>`).join('')}</div>`:''}
                <hr style="border-color:#1a1a1a;margin:14px 0;">
                <p style="font-weight:600;">⭐ Rate this ${type}</p>`;
            if(userRating){
                html+=`<p>You rated: ${'★'.repeat(userRating.stars)}${'☆'.repeat(5-userRating.stars)}</p>`;
            }else if(currentUser){
                html+=`<div class="star-rating-interactive" id="starRating"><span class="star" data-v="1">☆</span><span class="star" data-v="2">☆</span><span class="star" data-v="3">☆</span><span class="star" data-v="4">☆</span><span class="star" data-v="5">☆</span></div>
                <textarea id="ratingComment" placeholder="Optional comment" style="width:100%;margin:8px 0;"></textarea>
                <button class="btn-primary" id="submitRating" disabled>Submit</button>`;
            }else html+='<p>Login to rate.</p>';
            $('viewModalContent').innerHTML=html;
            $('viewModalOverlay').classList.add('open');
            if(!userRating&&currentUser){
                let sel=0;
                const starsEl=$('starRating');
                starsEl.addEventListener('mouseover',function(e){ if(e.target.classList.contains('star')){ const v=+e.target.dataset.v; starsEl.querySelectorAll('.star').forEach((s,i)=>{s.textContent=i<v?'★':'☆'; s.classList.toggle('hover',i<v);}); }});
                starsEl.addEventListener('mouseleave',()=>{ starsEl.querySelectorAll('.star').forEach((s,i)=>{s.textContent=i<sel?'★':'☆'; s.classList.remove('hover');}); });
                starsEl.addEventListener('click',function(e){ if(e.target.classList.contains('star')){ sel=+e.target.dataset.v; starsEl.querySelectorAll('.star').forEach((s,i)=>{s.textContent=i<sel?'★':'☆'; s.classList.toggle('selected',i<sel);}); $('submitRating').disabled=false; }});
                $('submitRating').addEventListener('click',async()=>{
                    const comment=$('ratingComment').value.trim().substring(0,500);
                    const snap=await get(ref(db,'users/'+currentUser.uid));
                    const uname=(snap.val()||{}).username||currentUser.email.split('@')[0];
                    const ratingData={stars:sel,comment,username:uname,createdAt:serverTimestamp()};
                    const path=type==='tools'?`tools/${item.id}/ratings/${currentUser.uid}`:`guides/${item.id}/ratings/${currentUser.uid}`;
                    await set(ref(db,path),ratingData);
                    toast('✅ Rating submitted!'); closeViewModal();
                });
            }
        }
        function closeViewModal(){ $('viewModalOverlay').classList.remove('open'); }
        window.closeViewModal=closeViewModal;

        // Add modal
        window.openAddModal=function(){
            if(!isModerator) return toast('❌ Moderator only.');
            pendingTags=[]; pendingLinks=[];
            $('addForm').reset();
            $('tagsDisplay').innerHTML=''; $('linksContainer').innerHTML='';
            updateAddSubcategories();
            $('addModalOverlay').classList.add('open');
        };
        function closeAddModal(){ $('addModalOverlay').classList.remove('open'); }
        window.closeAddModal=closeAddModal;

        function updateAddSubcategories(){
            const cat=$('addCategory').value;
            const subs=cat==='tools'?['pve','pvp','building','multifunctional']:['buildings','farms','glitches','survival','other'];
            $('addSubcategory').innerHTML=subs.map(s=>`<option value="${s}">${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');
        }
        $('addCategory').addEventListener('change',updateAddSubcategories);

        $('tagInput').addEventListener('keydown',function(e){
            if(e.key==='Enter'){
                e.preventDefault();
                const val=this.value.trim();
                if(val && pendingTags.length<10 && !pendingTags.includes(val)){
                    pendingTags.push(val);
                    renderTagPills();
                }
                this.value='';
            }
        });
        function renderTagPills(){
            $('tagsDisplay').innerHTML=pendingTags.map((t,i)=>`<span class="banner-tag" style="cursor:pointer;">#${escapeHTML(t)} <span data-idx="${i}" style="color:red;">×</span></span>`).join('');
            $('tagsDisplay').querySelectorAll('span[data-idx]').forEach(s=>s.addEventListener('click',function(){
                pendingTags.splice(+this.dataset.idx,1); renderTagPills();
            }));
        }

        function addLinkEntry(name='',url=''){
            const idx=pendingLinks.length;
            pendingLinks.push({name,url});
            const div=document.createElement('div'); div.className='link-entry'; div.style.display='flex'; div.style.gap='6px'; div.style.marginBottom='6px';
            div.innerHTML=`<input placeholder="Name" value="${escapeHTML(name)}" class="link-name" style="flex:1;"><input placeholder="URL" value="${escapeHTML(url)}" class="link-url" style="flex:2;"><button type="button" class="remove-link-btn">✕</button>`;
            $('linksContainer').appendChild(div);
            div.querySelector('.remove-link-btn').addEventListener('click',()=>{ pendingLinks.splice(idx,1); div.remove(); });
            div.querySelector('.link-name').addEventListener('input',function(){ pendingLinks[idx].name=this.value; });
            div.querySelector('.link-url').addEventListener('input',function(){ pendingLinks[idx].url=this.value; });
        }
        $('addLinkBtn').addEventListener('click',()=>addLinkEntry());

        $('addForm').addEventListener('submit',async(e)=>{
            e.preventDefault();
            const category=$('addCategory').value, sub=$('addSubcategory').value;
            const name=$('addName').value.trim();
            const preview=$('addPreviewDesc').value.substring(0,500);
            const full=$('addFullDesc').value.substring(0,4000);
            const imageUrl=$('addImageUrl').value.trim();
            const paid=$('addPaid').checked;
            const links=[...pendingLinks].filter(l=>l.name&&l.url);
            if(!name||!preview) return toast('Name and preview required.');
            const snap=await get(ref(db,'users/'+currentUser.uid));
            const uname=(snap.val()||{}).username||currentUser.email.split('@')[0];
            const entry={name,tags:[...pendingTags],previewDesc:preview,fullDesc:full,imageUrl,links,paid,subcategory:sub,category,addedBy:currentUser.uid,addedByUsername:uname,createdAt:serverTimestamp(),ratings:{}};
            await push(ref(db,category==='tools'?'tools':'guides'),entry);
            toast('✅ Added!'); closeAddModal();
        });

        // Character counters
        $('addPreviewDesc').addEventListener('input',()=>$('previewCharCount').textContent=`${$('addPreviewDesc').value.length} / 500`);
        $('addFullDesc').addEventListener('input',()=>$('fullCharCount').textContent=`${$('addFullDesc').value.length} / 4000`);

        // Search triggers
        $('toolsSearchInput').addEventListener('keydown',e=>{if(e.key==='Enter')renderTools();});
        $('toolsPaidFilter').addEventListener('change',renderTools);
        $('toolsSearchBtn').addEventListener('click',renderTools);
        $('guidesSearchInput').addEventListener('keydown',e=>{if(e.key==='Enter')renderGuides();});
        $('guidesSearchBtn').addEventListener('click',renderGuides);

        // Home animations
        function animateHome(){
            const big=$('homeBigText');
            big.style.opacity='1';
            big.classList.add('flicker');
            setTimeout(()=>big.classList.remove('flicker'),600);
            $('homeSubtitle').classList.add('visible');
            $('homeStatsRow').classList.add('visible');
            animateCounters();
        }
        function animateCounters(){
            const ids=['statTools','statGuides','statUsers'];
            ids.forEach(id=>{
                const el=$(id);
                const target=+el.getAttribute('data-target')||0;
                rollNumber(el, target);
            });
        }
        function rollNumber(el, target, duration=1200){
            const start=0;
            const startTime=performance.now();
            function update(now){
                const progress=Math.min((now-startTime)/duration,1);
                const current=Math.floor(start+(target-start)*progress);
                el.textContent=current.toLocaleString();
                if(progress<1) requestAnimationFrame(update);
                else el.textContent=target.toLocaleString();
            }
            requestAnimationFrame(update);
        }
        // Stats listener
        onValue(ref(db,'tools'), snap=>{ const c=snap.exists()?Object.keys(snap.val()).length:0; $('statTools').setAttribute('data-target',c); if(activeMainTab==='home') rollNumber($('statTools'),c); });
        onValue(ref(db,'guides'), snap=>{ const c=snap.exists()?Object.keys(snap.val()).length:0; $('statGuides').setAttribute('data-target',c); if(activeMainTab==='home') rollNumber($('statGuides'),c); });
        onValue(ref(db,'activeUsers'), snap=>{
            const today=new Date().toISOString().split('T')[0];
            let count=0;
            if(snap.exists()) Object.values(snap.val()).forEach(u=>{ if(u.date===today) count++; });
            $('statUsers').setAttribute('data-target',count);
            if(activeMainTab==='home') rollNumber($('statUsers'),count);
        });

        // Init
        setupListeners();
        updateAddSubcategories();
        animateHome();
        window.addEventListener('click',function(e){
            if(e.target===$('authModalOverlay')) closeAuthModal();
            if(e.target===$('addModalOverlay')) closeAddModal();
            if(e.target===$('viewModalOverlay')) closeViewModal();
        });
    </script>
</body>
</html>
